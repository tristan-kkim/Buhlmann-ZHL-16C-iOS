# 의존성 취약점 — 보안 기준선 §1
# (cortexys.web/docs/SECURITY_BASELINE.md)
#
# Dependabot 은 GitHub 이 리포 밖에서 돌리므로 재사용 워크플로에 넣을 수 없다.
# 그래서 이 파일만은 리포마다 둔다.
#
# cooldown: 갓 올라온 버전은 며칠 두고 본다. 공급망 공격은 배포 직후
# 몇 시간~며칠 안에 발견되고 철회되는 경우가 많다.
version: 2
updates:
  - package-ecosystem: swift
    directory: "/"
    schedule:
      interval: weekly
      day: monday
      time: "09:00"
      timezone: Asia/Seoul
    open-pull-requests-limit: 3
    # minor·patch 는 한 PR 로 묶는다. 묶지 않으면 패키지마다 PR 이 따로 열리고,
    # PR 마다 CI·보안 스캔이 돌아 계정 동시 실행 한도를 채운다
    # (2026-09-21 첫 활성화 때 12개 리포에서 PR 75개·대기 실행 86개가 한꺼번에 생겨
    #  운영 배포 CI 까지 큐에 막혔다).
    groups:
      minor-and-patch:
        update-types: [minor, patch]
    cooldown:
      default-days: 5

  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: weekly
      day: monday
      time: "09:00"
      timezone: Asia/Seoul
    open-pull-requests-limit: 3
    # minor·patch 는 한 PR 로 묶는다. 묶지 않으면 패키지마다 PR 이 따로 열리고,
    # PR 마다 CI·보안 스캔이 돌아 계정 동시 실행 한도를 채운다
    # (2026-09-21 첫 활성화 때 12개 리포에서 PR 75개·대기 실행 86개가 한꺼번에 생겨
    #  운영 배포 CI 까지 큐에 막혔다).
    ignore:
      # 공용 보안 스캔 재사용 워크플로(비공개 리포, @main 고정)는 Dependabot 이 읽을 권한이 없어
      # github_actions 업데이트 잡이 git_dependencies_not_reachable 로 실패했다 (2026-09-22).
      # 브랜치 고정이라 올릴 버전도 없으므로 제외한다.
      - dependency-name: "tristan-kkim/cortexys.web*"
    groups:
      minor-and-patch:
        update-types: [minor, patch]
    cooldown:
      default-days: 5

